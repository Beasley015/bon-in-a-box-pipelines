script: PrepSpatialData.R
name: Add spatial attributes to hexagonal grid
Description: Add carrying capacity to hexagonal grid used in SamPy
author:
  - name: Emily Beasley

inputs:
  rasters: 
    label: land cover raster
    description: raster of land cover data on which the hexagonal grid is overlaid
    type: image/tiff;application=geotiff[]
    example: cec_land_cover.tif
  raw_grid:
    label: raw hexagonal grid
    description: hexagonal grid of study area with no attributes
    type: geojson
  cases:
    label: rabies cases
    description: file path to .csv containing coordinates of raccoon rabies cases in lat/long format and year
    type: text/csv
    example: null
  vaccination:
    label: vaccination shapefile
    description: file path to shapefile (.shp) containing vaccination year, type, and annual vaccination rate
    type:  application/dbf
    example: null

outputs:
  K_grid:
    label: Carrying capacity grid
    description: geojson containing spatial information of the hexagonal grid
    type: geojson
  case_grid:
    label: Case grid
    description: geojson containing cells with known raccoon rabies cases by year
    type: geojson
  vax_grid: 
    label: Vaccination grid
    descripton: geojson containing cells with vaccines applied by year, vaccination type, and vaccination rate
    type: geojson

conda:
  channels:
    - conda-forge
    - r
  dependencies:
    - r-tidyverse
    - r-units
    - r-rjson
    - r-sf
    - r-terra
    - r-exactextractr
